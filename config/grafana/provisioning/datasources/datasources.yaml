apiVersion: 1

datasources:
  - name: Loki
    uid: loki-ds
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: "${__value.raw}"
          urlDisplayLabel: "View in Jaeger"
          datasourceUid: jaeger-ds
  
  - name: Jaeger
    uid: jaeger-ds
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki-ds
        filterByTraceID: true
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        customQuery: true
        query: '{service="${__span.tags.service}"} | json | trace_id="${__trace.traceId}'

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        # 2 s instead of 5 s so short-lived pipeline containers
        # (blackhole, starmapper, hubble) are discovered before they exit.
        refresh_interval: 1s
        filters:
          - name: label
            values: ["com.docker.compose.project=schauling"]
          # Include recently stopped containers so their logs are not lost
          # when the container exits before Promtail had time to scrape them.
          - name: status
            values: ["running", "exited"]

    relabel_configs:
      # Strip leading slash from container name
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container

      # Use the Docker Compose service name as the Loki "service" label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

    pipeline_stages:
      # Parse zap's structured JSON output
      - json:
          expressions:
            level:    level
            msg:      msg
            trace_id: trace_id
            span_id:  span_id
            method:   method
            path:     path
            status:   status

      # Promote low-cardinality fields as Loki labels
      - labels:
          level:
          service:

      # Silence health-check pings on GET / so they don't flood the log view
      - drop:
          expression: '.*"path":"/".*'

      # Store trace correlation IDs as structured metadata (high cardinality — not labels)
      - structured_metadata:
          trace_id:
          span_id:
